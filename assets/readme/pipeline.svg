<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">一次「发布打包」的八个固定步骤</title>
  <desc id="flowDesc">发布打包的顺序：查发布信息、正式环境二次确认、编译、压成 zip、执行后置命令、上传 OSS、回调内务府登记、清理产物。任一步失败即中断。</desc>

  <rect width="1200" height="400" rx="24" fill="#0B0E12"/>

  <g id="heading" transform="translate(64 0)">
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="600" fill="#E8EDF4">一次「发布打包」的固定顺序</text>
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18" fill="#6E7A8A">任一步失败即中断；前置条件缺失会在编译开始前就报错</text>
  </g>

  <g id="row-1">
    <g transform="translate(64 118)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">01</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">查发布信息</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">isProduce</text>
    </g>
    <g transform="translate(338 118)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#E5534B">02</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">正式确认</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">正式库二次确认</text>
    </g>
    <g transform="translate(612 118)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">03</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">编译</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">dotnet / npm</text>
    </g>
    <g transform="translate(886 118)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">04</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">压成 zip</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">publish-zip\</text>
    </g>
  </g>

  <g id="row-2">
    <g transform="translate(64 252)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">05</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">后置命令</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">失败即中断</text>
    </g>
    <g transform="translate(338 252)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">06</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">上传 OSS</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">NWF/Project/</text>
    </g>
    <g transform="translate(612 252)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">07</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">回调登记</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">内务府发布记录</text>
    </g>
    <g transform="translate(886 252)">
      <rect width="250" height="104" rx="12" fill="#14181F" stroke="#232A35"/>
      <circle cx="40" cy="52" r="18" fill="none" stroke="#2E3A49"/>
      <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#3D9BEF">08</text>
      <text x="72" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei UI, sans-serif" font-size="22" fill="#E8EDF4">清理产物</text>
      <text x="72" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#8A96A8">只留 zip 包</text>
    </g>
  </g>
</svg>
