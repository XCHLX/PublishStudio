name: 发布 Release

# 发版流程：本地改好版本号并提交 → git tag v0.4.0 → git push origin v0.4.0
# 工作流自动构建三种包、创建 Release、上传附件。
on:
  push:
    tags:
      - 'v*'
  # 手动触发：改完工作流不用删 tag 重推，直接在 Actions 页点 Run workflow 重跑验证。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # tag 形如 v0.4.0，去掉开头的 v 作为版本号传给脚本；
      # 版本号同时决定 zip/setup 的文件名和 exe「关于」窗口里显示的版本。
      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          # tag 触发用 tag 名（v0.4.0 -> 0.4.0）；手动触发读 csproj 的 Version。
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "tag 必须是 v主.次.补丁 形式，例如 v0.4.0；当前是 $tag"
            }
          } else {
            $csproj = Get-Content .\PublishStudio.csproj -Raw
            if ($csproj -notmatch '<Version>([^<]+)</Version>') {
              throw "csproj 里找不到 <Version>"
            }
            $version = $Matches[1].Trim()
          }
          # tag 与 csproj 版本不一致时给警告：本地启动读的是 csproj，
          # 不同步的话会出现「本地显示 V0.4.0、发布出来是 V0.0.7」这种错觉。
          $csprojVersion = ([regex]::Match((Get-Content .\PublishStudio.csproj -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value.Trim()
          if ($csprojVersion -ne $version) {
            Write-Host "::warning::csproj 的 <Version> 是 $csprojVersion，与 tag 的 $version 不一致；本地启动会显示 V$csprojVersion。建议改用 .\release.ps1 -Version $version 发版。"
          }

          Write-Host "版本号: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 每个版本的发行说明写在 docs/release-notes/v<版本>.md。
      # 找不到就用通用说明 docs/release-notes/v.md，其中的 {{VERSION}} 会替换成实际版本号，
      # 这样通用说明里的包名（如 PublishStudio-{{VERSION}}-win-x64.zip）始终和本次产物对得上。
      - name: 检查版本说明
        id: notes
        shell: pwsh
        run: |
          $version  = "${{ steps.ver.outputs.version }}"
          $specific = "docs/release-notes/v$version.md"
          $fallback = "docs/release-notes/v.md"

          if (Test-Path $specific) {
            $body = $specific
            Write-Host "使用该版本专属说明: $body"
          }
          elseif (Test-Path $fallback) {
            $body = Join-Path $env:RUNNER_TEMP "release-notes.md"
            (Get-Content $fallback -Raw -Encoding utf8) -replace '\{\{VERSION\}\}', $version |
              Set-Content -Path $body -Encoding utf8
            Write-Host "::notice::没有 $specific，改用通用说明 $fallback（版本占位符已替换为 $version）"
          }
          else {
            throw "缺少版本说明：$specific 和通用说明 $fallback 都不存在。至少写一份再发版。"
          }

          "body_path=$body" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 构建自包含版 + 框架依赖版
        shell: pwsh
        run: |
          .\build-release.ps1 -Flavor All -Version "${{ steps.ver.outputs.version }}"

      # GitHub 的 windows-latest 镜像预装 Inno Setup 6。
      # 找不到就直接报错——绝不在 CI 里自动下载安装。
      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "构建机上找不到 Inno Setup 6 的 ISCC.exe，请确认镜像是否预装。"
          }

          Write-Host "使用 ISCC: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "deploy\PublishStudio.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，退出码 $LASTEXITCODE"
          }

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem .\release\*.zip, .\release\*.exe | Select-Object Name, Length

      - name: 创建 Release 并上传三个包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PublishStudio v${{ steps.ver.outputs.version }}
          # 自己写的版本说明在前，GitHub 自动生成的 changelog 追加在后（含 Full Changelog 链接）。
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.exe
